<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sem conexão — Agenda Jet Skis</title>
<style>
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0B3B45;color:#F4F1E8;
    height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .card{max-width:360px}
  h1{font-size:1.4rem;margin-bottom:8px}
  p{opacity:.8;line-height:1.5}
  button{margin-top:20px;background:#F4A261;color:#0B3B45;border:none;border-radius:999px;
    padding:12px 24px;font-weight:600;font-size:1rem}
</style>
</head>
<body>
  <div class="card">
    <h1>Sem conexão</h1>
    <p>Conecte-se à internet para ver a agenda atualizada e realizar um agendamento. Reservas nunca são feitas offline, para evitar conflitos de horário.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
